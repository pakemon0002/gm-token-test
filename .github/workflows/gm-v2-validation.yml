name: GM TOKEN 2.0 validation
on:
  push:
    branches:
      - feature/gm-token-200-levels-redesign
  pull_request:
    branches:
      - main
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Server syntax
        run: node --check server/game.mjs && node --check server/mining-progression.mjs
      - name: Server and integration tests
        run: npm test
        env:
          GM_MINING_V2: '0'
          GM_TEST_STARTER_FUNDS: '0'
          GM_TEST_OPEN_TRADING: '0'
      - name: Typecheck and compile miniapp
        run: |
          cd miniapp
          npm install --no-audit --no-fund
          npx tsc -p tsconfig.standalone.json
          node --check public/main.js
      - name: Sync standalone preview into the feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/gm-token-200-levels-redesign'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add miniapp/public/main.js miniapp/public/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "build: sync generated standalone preview [skip ci]"
            git push origin "HEAD:feature/gm-token-200-levels-redesign"
          fi
      - name: Retain compiled preview for review
        uses: actions/upload-artifact@v4
        with:
          name: gm-token-v2-preview
          path: |
            miniapp/public/main.js
            miniapp/public/styles.css
