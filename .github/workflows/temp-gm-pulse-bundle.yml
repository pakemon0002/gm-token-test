name: Temporary GM PULSE bundle sync
on:
  push:
    branches:
      - feature/gm-pulse-animated-farm-ui-20261123
permissions:
  contents: write
jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Compile and verify Mini App source
        run: |
          npm install --prefix miniapp --no-audit --no-fund
          npm run --prefix miniapp build:standalone
          node --check miniapp/public/main.js
      - name: Commit served UI assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/public/main.js miniapp/public/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "build: sync GM PULSE farm visuals [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
