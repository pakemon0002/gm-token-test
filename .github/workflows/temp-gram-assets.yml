name: Temporary GM GRAM verification asset sync
on:
  push:
    branches:
      - feature/gram-paid-verification-20261118
permissions:
  contents: write
jobs:
  compile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --prefix miniapp --no-fund --no-audit
      - run: npm run --prefix miniapp build:standalone
      - run: node --check miniapp/public/main.js
      - name: Commit compiled Mini App bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/public/main.js miniapp/public/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "build: sync GRAM verification Mini App assets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
