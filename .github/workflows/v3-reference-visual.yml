name: V3 reference visual check
on:
  push:
    branches: [design/v3-reference-match]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --prefix miniapp --no-fund --no-audit
      - run: npm run --prefix miniapp build:standalone
      - run: node --check miniapp/public/main.js
      - run: npm install --prefix /tmp/gm-reference --no-save --no-fund --no-audit jsdom@26.1.0 playwright@1.51.1
      - run: GM_DOM_MODULE=/tmp/gm-reference/node_modules/jsdom node scripts/check-v3-runtime.mjs
      - run: /tmp/gm-reference/node_modules/.bin/playwright install --with-deps chromium
      - run: GM_PLAYWRIGHT_MODULE=/tmp/gm-reference/node_modules/playwright node scripts/check-v3-visual.mjs
      - run: npm test
      - name: Sync verified source and compiled assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/public/main.js miniapp/public/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "build: sync V3 reference screens [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
