name: V3 runtime hotfix
on:
  push:
    branches: [fix/v3-react-runtime]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --prefix miniapp --no-fund --no-audit
      - run: npm run --prefix miniapp build:standalone
      - run: node --check miniapp/public/main.js
      - run: npm install --prefix /tmp/gm-runtime --no-save --no-fund --no-audit jsdom@26.1.0
      - run: GM_DOM_MODULE=/tmp/gm-runtime/node_modules/jsdom node scripts/check-v3-runtime.mjs
      - run: npm test
      - name: Sync compiled hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/public/main.js miniapp/public/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "build: sync React 16 V3 runtime fix [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
