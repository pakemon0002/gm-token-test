name: GM TOKEN verified-holder checks
on:
  push:
    branches: [feature/verified-holder-podium-20261111]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  proof-and-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install pinned TON verifier and run server tests
        run: |
          npm install --no-audit --no-fund
          npm test
      - name: Build Mini App and check compiled source
        run: |
          npm install --prefix miniapp --no-audit --no-fund
          npm run --prefix miniapp build:standalone
          node --check miniapp/public/main.js
      - name: Publish compiled assets only to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add miniapp/public/main.js miniapp/public/styles.css
          if ! git diff --cached --quiet; then
            git commit -m "build: verified holder UI assets [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
