name: VOLT clean dashboard checks
on:
  push:
    branches: [design/volt-dashboard-v7]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --check miniapp/public/volt.js && node --check miniapp/public/volt-balance.js
      - run: npm test
      - run: npm install --prefix /tmp/volt-browser --no-save --no-fund --no-audit playwright@1.51.1
      - run: /tmp/volt-browser/node_modules/.bin/playwright install chromium
      - run: GM_PLAYWRIGHT_MODULE=/tmp/volt-browser/node_modules/playwright node scripts/check-volt-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volt-dashboard-mobile
          path: volt-screenshots/
