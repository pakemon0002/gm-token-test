name: VOLT studio GPU release
on:
  push:
    branches: [fix/volt-gpu-live-3d]
    paths-ignore: ['.github/workflows/volt-gpu-art-inspect.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: node --check miniapp/public/volt.js && node --check miniapp/public/volt-gpu-live.js
      - run: npm test
      - run: npm install --prefix /tmp/volt-browser --no-save --no-fund --no-audit playwright@1.51.1
      - run: /tmp/volt-browser/node_modules/.bin/playwright install chromium
      - run: GM_PLAYWRIGHT_MODULE=/tmp/volt-browser/node_modules/playwright node scripts/check-volt-visual.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: volt-studio-gpu-screens
          path: volt-screenshots/
