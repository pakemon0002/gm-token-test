
# GM TOKEN v5 — existing Render server
services:
  - type: web
    name: gm-token-test
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --no-fund --no-audit && env -u GM_JETTON_MASTER_ADDRESS -u TONAPI_KEY -u BOT_TOKEN -u BOT_WEBHOOK_SECRET -u PUBLIC_APP_URL -u OWNER_TELEGRAM_IDS -u OWNER_TOTP_SECRETS -u GM_TEST_OPEN_TRADING -u GM_ADMIN_TEST_GRANTS -u GM_TEST_STARTER_FUNDS -u GM_MINING_FAST_TRACK -u GM_ENABLE_REWARDS -u GM_TASKS_ENABLED -u DAILY_REWARD_GM -u BOX_REWARDS_GM_JSON npm test
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: BOT_USERNAME
        value: gm_token_test_bot
      - key: BOT_POLLING
        value: "0"
      - key: GM_ADMIN_TEST_GRANTS
        value: "1"
      - key: GM_TEST_OPEN_TRADING
        value: "1"
      - key: GM_TEST_STARTER_FUNDS
        value: "1"
      - key: GM_MINING_FAST_TRACK
        value: "1"
      - key: GM_ENABLE_REWARDS
        value: "1"
      - key: GM_TASKS_ENABLED
        value: "1"
      - key: DAILY_REWARD_GM
        value: "10"
      - key: BOX_REWARDS_GM_JSON
        value: '{"bronze":15,"silver":45,"gold":105}'
      - key: DB_PATH
        value: /tmp/gm-token-test.sqlite
      - key: BOT_TOKEN
        sync: false
      - key: BOT_WEBHOOK_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: OWNER_TELEGRAM_IDS
        sync: false
      - key: OWNER_TOTP_SECRETS
        sync: false
